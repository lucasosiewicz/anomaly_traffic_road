data:
  path: "D:\\MAGISTERKA\\anomaly_traffic_road\\datasets\\DoTA"
  batch_size: 64
  sequence_length: 4
  stride: 1
model:
  name: "ResNet" # ConvAE, ResNet, ResNetLSTM, LargerConvAE
trainer:
  epochs: 100
  device: "cuda" # 'cuda', 'cpu', or 'auto'
  learning_rate: 0.001
  class_weights: [1.87, 3.05, 71.5, 124.48, 9.72, 87.74]
logging:
  experiment_name: "DoTA-dataset"
  run_name: "ResNet-Grayscale-mapped-class-weights"
  tracking_uri: "http://localhost:5000"
  log_model: True
  checkpoint_dir: "src/models/ResNet/checkpoints/"
  checkpoint_filename: "ResNet-Grayscale-{epoch}-{val_loss:.2f}"
callbacks:
  early_stopping_patience: 3
evaluation:
  plot_save_path: "src/plots"